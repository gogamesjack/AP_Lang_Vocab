<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>AP Lang Vocab 5 — Spellwell</title>
  <style>
    :root {
      --bg: #f5f5f0;
      --paper: #fff;
      --ink: #202b27;
      --muted: #79827d;
      --green: #287956;
      --green-dark: #1b6245;
      --pale: #e8f3ec;
      --line: #e5e9e4;
      --red: #ad4c4a;
      --gold: #a66b19;
      --shadow: 0 18px 55px #1d302510
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0, #e9f0e9 0, transparent 50%), var(--bg);
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", Avenir, Inter, system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding: 28px 18px 42px
    }

    button,
    input {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .shell {
      width: min(860px, 100%)
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 22px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.04em
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 5px 12px #2879562b
    }

    .course {
      font-size: 11px;
      letter-spacing: .12em;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .quiz {
      padding: 28px clamp(20px, 6vw, 60px) 24px
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .12em;
      font-weight: 850;
      color: var(--muted)
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      color: var(--muted);
      font-size: 13px
    }

    .track {
      height: 8px;
      border-radius: 9px;
      background: #e9ede8;
      overflow: hidden;
      margin-bottom: 30px
    }

    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #277653, #60ae80);
      border-radius: inherit;
      transition: width .55s cubic-bezier(.2, .8, .2, 1)
    }

    .prompt-card {
      background: linear-gradient(140deg, #fbfcfa, #f6f9f5);
      border: 1px solid #edf0eb;
      border-radius: 19px;
      padding: clamp(24px, 5vw, 44px) clamp(18px, 5vw, 50px) 32px;
      text-align: center;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .tag {
      align-self: center;
      background: var(--pale);
      color: var(--green);
      padding: 7px 11px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .09em
    }

    .prompt-label {
      font-size: 13px;
      color: var(--muted);
      margin: 20px 0 9px
    }

    .definition {
      font-size: clamp(19px, 3vw, 25px);
      line-height: 1.43;
      letter-spacing: -.025em;
      font-weight: 740;
      max-width: 650px;
      margin: 0 auto 26px
    }

    .entry-wrap {
      width: min(520px, 100%);
      margin: 0 auto
    }

    .answer {
      width: 100%;
      height: 58px;
      border: 1px solid #dce4dc;
      border-radius: 13px;
      background: #fff;
      text-align: center;
      padding: 0 16px;
      font-size: 19px;
      font-weight: 650;
      color: var(--ink);
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    .answer:focus {
      border-color: #60a580;
      box-shadow: 0 0 0 4px #28795616
    }

    .answer:disabled {
      opacity: .7
    }

    .feedback {
      min-height: 25px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55
    }

    .feedback.good {
      color: var(--green);
      font-weight: 750
    }

    .feedback.bad {
      color: var(--red);
      font-weight: 650
    }

    .feedback.hint {
      color: var(--gold)
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 13px
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 13px;
      font-weight: 780;
      transition: transform .16s, background .16s, box-shadow .16s
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .primary {
      background: var(--green);
      color: #fff;
      box-shadow: 0 6px 14px #28795625
    }

    .primary:hover {
      background: var(--green-dark)
    }

    .secondary {
      background: #f0f3ef;
      color: var(--ink)
    }

    .secondary:hover {
      background: #e8ede8
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px
    }

    .stat {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .stat strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums
    }

    .screen {
      min-height: 500px;
      display: grid;
      place-items: center;
      padding: 28px
    }

    .intro,
    .finish {
      width: min(570px, 100%);
      text-align: center
    }

    .spark {
      font-size: 39px;
      color: var(--green)
    }

    h1 {
      font-size: clamp(30px, 6vw, 44px);
      letter-spacing: -.055em;
      line-height: 1.05;
      margin: 12px 0
    }

    .sub {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin: 12px auto 24px;
      max-width: 450px
    }

    .list-preview {
      border: 1px solid var(--line);
      background: #fafbf9;
      text-align: left;
      border-radius: 14px;
      padding: 16px 19px;
      margin: 0 auto 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7
    }

    .list-preview b {
      color: var(--ink)
    }

    .bestbox {
      background: #f7f9f6;
      border-radius: 15px;
      padding: 17px;
      margin: 23px auto;
      max-width: 380px
    }

    .bestbox small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .1em
    }

    .bestbox strong {
      display: block;
      font-size: 28px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums
    }

    .confetti {
      position: fixed;
      z-index: 5;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden
    }

    .piece {
      position: absolute;
      width: 8px;
      height: 11px;
      border-radius: 2px;
      animation: fall 850ms cubic-bezier(.12, .68, .3, 1) forwards
    }

    @keyframes fall {
      0% {
        transform: translate(0, 0) rotate(0);
        opacity: 1
      }

      100% {
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
        opacity: 0
      }
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      clip: rect(0, 0, 0, 0);
      overflow: hidden
    }

    @media(max-width:540px) {
      body {
        padding: 17px 12px 28px
      }

      .top {
        margin-bottom: 15px
      }

      .quiz {
        padding: 20px 15px 17px
      }

      .track {
        margin-bottom: 17px
      }

      .prompt-card {
        min-height: 330px;
        padding: 23px 14px
      }

      .bottom {
        font-size: 10px
      }

      .course {
        font-size: 9px
      }

      .screen {
        min-height: 450px;
        padding: 22px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><span class="mark">✳</span><span>spellwell</span></div>
      <div class="course">AP Lang Vocab 5</div>
    </header>
    <main id="app" class="panel" aria-live="polite"></main>
  </div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script>
    (() => {
      'use strict';
      const WORDS = [
        { word: 'Intransigence', hint: 'In-tran-si-gence', definition: 'Stubborn refusal to change your mind or compromise' },
        { word: 'Chagrin', hint: 'Cha-grin', definition: 'A feeling of embarrassment or disappointment' },
        { word: 'Predilection', hint: 'Pre-di-lec-tion', definition: 'A strong liking or preference for something' },
        { word: 'Incontrovertible', hint: 'In-con-tro-ver-ti-ble', definition: 'So clearly true that it cannot reasonably be disputed' },
        { word: 'Equivocate', hint: 'E-qui-vo-cate', definition: 'To avoid giving a clear or direct answer' },
        { word: 'Incongruous', hint: 'In-con-gru-ous', definition: 'Strange or out of place because something does not fit' },
        { word: 'Acquiesce', hint: 'Ac-qui-esce', definition: 'To accept or agree to something without resisting' },
        { word: 'Paradox', hint: 'Para-dox', definition: 'A seeming contradiction that may reveal a truth' },
        { word: 'Asyndeton', hint: 'A-syn-de-ton', definition: 'The omission of conjunctions between words or phrases' },
        { word: 'Polysyndeton', hint: 'Poly-syn-de-ton', definition: 'The use of multiple conjunctions in close succession' }
      ];
      const KEY = 'spellwell.best.ap-lang-vocab-4';
      const app = document.getElementById('app');
      const fmt = s => { s = Math.floor(s); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` };
      let order = [], index = 0, attempts = 0, misses = {}, correct = 0, start = 0, tick = null, locked = false, best = readBest();
      function readBest() { try { const n = Number(localStorage.getItem(KEY)); return n > 0 ? n : null } catch (_) { return null } }
      const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      function intro() { clearInterval(tick); app.innerHTML = `<section class="screen"><div class="intro"><div class="spark">✳</div><h1>Words worth knowing.</h1><p class="sub">A quick spelling round for your AP Lang vocabulary. Read the definition, type the word, and build your streak one answer at a time.</p><div class="list-preview"><b>10 words</b> · hints appear after two misses<br><b>Retry once</b> after an incorrect spelling, with a letter-distance clue</div><button class="btn primary" id="start">Start practicing&nbsp; →</button>${best !== null ? `<div class="bestbox"><small>PERSONAL BEST</small><strong>${fmt(best)}</strong></div>` : ''}</div></section>`; document.getElementById('start').onclick = begin; }
      function begin() { order = WORDS.map((_, i) => i).sort(() => Math.random() - .5); index = 0; attempts = 0; misses = {}; correct = 0; start = performance.now(); render(); tick = setInterval(updateTimer, 250); }
      function updateTimer() { const el = document.getElementById('timer'); if (el) el.textContent = fmt((performance.now() - start) / 1000); }
      function render() { if (index >= order.length) { finish(); return } const item = WORDS[order[index]]; attempts = 0; locked = false; app.innerHTML = `<section class="quiz"><div class="topline"><span class="eyebrow">SESSION PROGRESS</span><span class="timer" id="timer">${fmt((performance.now() - start) / 1000)}</span></div><div class="track" role="progressbar" aria-label="Words completed" aria-valuemin="0" aria-valuemax="${WORDS.length}" aria-valuenow="${correct}"><div class="fill" style="width:${correct / WORDS.length * 100}%"></div></div><div class="prompt-card"><span class="tag">✦ &nbsp;WORD ${String(correct + 1).padStart(2, '0')} OF ${WORDS.length}</span><p class="prompt-label">Spell the word that means:</p><p class="definition">${escapeHtml(item.definition)}</p><div class="entry-wrap"><label class="sr" for="answer">Your spelling</label><input id="answer" class="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer…"><p id="feedback" class="feedback" aria-live="polite">Press Enter or use the button to check.</p><div class="actions"><button class="btn primary" id="check">Check spelling&nbsp; ↗</button></div></div></div><div class="bottom"><span class="stat">Completed <strong>${correct}</strong> / ${WORDS.length}</span><span>Take your time · missed words return later</span></div></section>`; const input = document.getElementById('answer'); input.focus(); input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit() } }); document.getElementById('check').onclick = submit; }
      // Levenshtein distance: minimum insertions, deletions, and substitutions between strings.
      function distance(a, b) { a = a.toLocaleLowerCase(); b = b.toLocaleLowerCase(); let prev = Array.from({ length: b.length + 1 }, (_, i) => i); for (let i = 1; i <= a.length; i++) { const row = [i]; for (let j = 1; j <= b.length; j++)row[j] = Math.min(row[j - 1] + 1, prev[j] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = row } return prev[b.length] }
      function submit() {
        if (locked) return; const input = document.getElementById('answer'), feedback = document.getElementById('feedback'), given = input.value.trim(), item = WORDS[order[index]]; if (!given) { feedback.textContent = 'Type your spelling above to check it.'; return } if (given.toLocaleLowerCase() === item.word.toLocaleLowerCase()) { locked = true; correct++; feedback.className = 'feedback good'; feedback.textContent = 'That’s it! Nice work.'; burst(); const bar = app.querySelector('.fill'); bar.style.width = `${correct / WORDS.length * 100}%`; app.querySelector('[role=progressbar]').setAttribute('aria-valuenow', correct); app.querySelector('.bottom strong').textContent = correct; setTimeout(() => { index++; render() }, 650); return }
        attempts++; const key = item.word.toLocaleLowerCase(); misses[key] = (misses[key] || 0) + 1; const d = distance(given, item.word); feedback.className = misses[key] >= 2 ? 'feedback hint' : 'feedback bad'; if (attempts === 1) { feedback.textContent = `Not quite — ${d} letter${d === 1 ? '' : 's'} away by edit distance. Try once more; it may have been a typo.`; input.value = ''; input.focus(); return }
        locked = true; order.push(order[index]); const hint = misses[key] >= 2 ? ` Hint: ${item.hint}.` : ''; feedback.textContent = `Still not quite — ${d} letter${d === 1 ? '' : 's'} away. Press Enter to continue; this word will come around again.${hint}`; const button = document.getElementById('check'); button.textContent = 'Continue  →'; button.onclick = () => { if (!locked) return; index++; if (index >= order.length) { finish(); return } render() }; input.disabled = true; input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); button.click() } }); button.focus();
      }
      function burst() { const root = document.getElementById('confetti'), colors = ['#287956', '#80bb87', '#e4b552', '#ed8e77', '#87b8c8', '#b99bd0']; const rect = app.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height * .52; for (let i = 0; i < 24; i++) { const p = document.createElement('i'); p.className = 'piece'; p.style.left = `${cx}px`; p.style.top = `${cy}px`; p.style.background = colors[i % colors.length]; p.style.setProperty('--dx', `${(Math.random() - .5) * 300}px`); p.style.setProperty('--dy', `${(Math.random() - .7) * 230}px`); p.style.setProperty('--rot', `${Math.random() * 720 - 360}deg`); root.appendChild(p); setTimeout(() => p.remove(), 900) } }
      function finish() { clearInterval(tick); const seconds = (performance.now() - start) / 1000; if (best === null || seconds < best) { best = seconds; try { localStorage.setItem(KEY, String(seconds)) } catch (_) { } } app.innerHTML = `<section class="screen"><div class="finish"><div class="spark">✦</div><h1>Beautifully done.</h1><p class="sub">You practiced all ${WORDS.length} words in AP Lang Vocab 5.</p><div class="bestbox"><div style="display:flex;justify-content:space-around;gap:25px"><div><small>YOUR TIME</small><strong>${fmt(seconds)}</strong></div><div><small>PERSONAL BEST</small><strong>${fmt(best)}</strong></div></div></div><button class="btn primary" id="again">Practice again&nbsp; →</button></div></section>`; document.getElementById('again').onclick = intro }
      intro();
    })();
  </script>
</body>

</html>
