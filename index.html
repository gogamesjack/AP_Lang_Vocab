<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>AP Lang Vocabulary — Spellwell</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="index.html" aria-label="Go to vocabulary home"><span class="mark">✳</span><span>spellwell</span></a>
      <div class="course">AP Lang Vocabulary</div>
    </header>
    <main class="panel">
      <section class="screen">
        <div class="intro">
          <div class="spark">✳</div>
          <h1>Choose a vocabulary week.</h1>
          <p class="sub">Practice each AP Lang vocabulary set and try to improve your personal best.</p>
          <nav class="week-list" aria-label="Vocabulary weeks">
        <div class="week-row" data-week="1"><a class="week-link" href="week-1.html"><span>Week 1</span><small>10 words →</small></a><button class="clear-scores btn secondary" type="button" data-clear-week="1" aria-label="Clear scores for week 1">Clear scores</button><div class="score-history" aria-label="Week 1 score history"></div></div>
        <div class="week-row" data-week="2"><a class="week-link" href="week-2.html"><span>Week 2</span><small>10 words →</small></a><button class="clear-scores btn secondary" type="button" data-clear-week="2" aria-label="Clear scores for week 2">Clear scores</button><div class="score-history" aria-label="Week 2 score history"></div></div>
        <div class="week-row" data-week="3"><a class="week-link" href="week-3.html"><span>Week 3</span><small>10 words →</small></a><button class="clear-scores btn secondary" type="button" data-clear-week="3" aria-label="Clear scores for week 3">Clear scores</button><div class="score-history" aria-label="Week 3 score history"></div></div>
        <div class="week-row" data-week="4"><a class="week-link" href="week-4.html"><span>Week 4</span><small>10 words →</small></a><button class="clear-scores btn secondary" type="button" data-clear-week="4" aria-label="Clear scores for week 4">Clear scores</button><div class="score-history" aria-label="Week 4 score history"></div></div>
        <div class="week-row" data-week="5"><a class="week-link" href="week-5.html"><span>Week 5</span><small>10 words →</small></a><button class="clear-scores btn secondary" type="button" data-clear-week="5" aria-label="Clear scores for week 5">Clear scores</button><div class="score-history" aria-label="Week 5 score history"></div></div>
          </nav>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>

</html>
